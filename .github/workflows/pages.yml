name: Deploy blueprint to GitHub Pages

# Serves the committed blueprint site (formalize/certification/blueprint-demo/
# blueprint/web/) at the repo's GitHub Pages URL. The site is static and
# checked in, so no Lean or LaTeX toolchain runs here — regeneration stays a
# local step (lake build :blueprint && leanblueprint web).

on:
  push:
    branches: [main]
    paths:
      - "formalize/certification/blueprint-demo/blueprint/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: formalize/certification/blueprint-demo/blueprint/web
      - id: deployment
        uses: actions/deploy-pages@v4
